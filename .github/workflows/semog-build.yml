name: Semog Build Documenso

on:
  push:
    branches: [leandrosemog/documenso-2.18]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies for Semog patch tests
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test Semog recipient patches
        run: node --test apps/remix/app/utils/semog-recipient.test.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/semog-tech/documenso:2.18.0-semog
            ghcr.io/semog-tech/documenso:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
