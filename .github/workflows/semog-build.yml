name: Semog Build Documenso

on:
  push:
    branches: [leandrosemog/documenso-2.18]
  workflow_dispatch:

concurrency:
  group: semog-documenso-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signing-checks:
    uses: ./.github/workflows/semog-check.yml
    permissions:
      contents: read

  build-and-push:
    needs: signing-checks
    # A manual dispatch from another branch must not overwrite the release tag.
    if: github.ref == 'refs/heads/leandrosemog/documenso-2.18'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/semog-tech/documenso:2.18.0-semog
            ghcr.io/semog-tech/documenso:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
